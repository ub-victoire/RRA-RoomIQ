spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: records-lifecycle-service
  datasource:
    url: ${RLC_DB_URL}
    username: ${RLC_DB_USERNAME}
    password: ${RLC_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: ${RLC_DB_MIGRATION_USERNAME}
    password: ${RLC_DB_MIGRATION_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
server:
  port: ${RLC_SERVICE_PORT:8089}
logging:
  level:
    root: INFO
    rw.rra.roomiq: INFO
roomiq:
  auth:
    jwt-secret: ${JWT_SECRET}
    booking-service-token:
      issuer: ${BOOKING_SERVICE_TOKEN_ISSUER:}
      current-key-id: ${BOOKING_SOURCE_EVIDENCE_CURRENT_KEY_ID:}
      current-public-key-location: ${BOOKING_SOURCE_EVIDENCE_CURRENT_PUBLIC_KEY_LOCATION:}
      previous-key-id: ${BOOKING_SOURCE_EVIDENCE_PREVIOUS_KEY_ID:}
      previous-public-key-location: ${BOOKING_SOURCE_EVIDENCE_PREVIOUS_PUBLIC_KEY_LOCATION:}
    records-lifecycle-service-token:
      issuer: ${RLC_SERVICE_TOKEN_ISSUER:}
      key-id: ${RLC_SERVICE_TOKEN_KEY_ID:}
      private-key-location: ${RLC_SERVICE_TOKEN_PRIVATE_KEY_LOCATION:}
  identity:
    url: ${IDENTITY_SERVICE_URL}
    connect-timeout: ${IDENTITY_CONNECT_TIMEOUT:2s}
    read-timeout: ${IDENTITY_READ_TIMEOUT:5s}
  lifecycle:
    source-evidence:
      max-age: ${RLC_SOURCE_EVIDENCE_MAX_AGE:PT24H}
      booking-requests:
        allowed-categories: ${RLC_BOOKING_SOURCE_EVIDENCE_ALLOWED_CATEGORIES:}
    booking-hold-instructions:
      enabled: ${RLC_BOOKING_HOLD_DELIVERY_ENABLED:true}
      url: ${RLC_BOOKING_HOLD_SERVICE_URL:${BOOKING_SERVICE_URL:}}
      connect-timeout: ${BOOKING_HOLD_CONNECT_TIMEOUT:2s}
      read-timeout: ${BOOKING_HOLD_READ_TIMEOUT:5s}
      delivery-interval: ${BOOKING_HOLD_DELIVERY_INTERVAL:PT10S}
      lease-duration: ${BOOKING_HOLD_LEASE_DURATION:PT30S}
      batch-size: ${BOOKING_HOLD_DELIVERY_BATCH_SIZE:20}
      max-attempts: ${BOOKING_HOLD_MAX_ATTEMPTS:12}
