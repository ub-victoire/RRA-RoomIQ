spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: records-lifecycle-service
  datasource:
    url: ${RLC_DB_URL}
    username: ${RLC_DB_USERNAME}
    password: ${RLC_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: ${RLC_DB_MIGRATION_USERNAME}
    password: ${RLC_DB_MIGRATION_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
server:
  port: ${RLC_SERVICE_PORT:8089}
logging:
  level:
    root: INFO
    rw.rra.roomiq: INFO
roomiq:
  auth:
    jwt-secret: ${JWT_SECRET}
    booking-service-token:
      issuer: ${BOOKING_SERVICE_TOKEN_ISSUER:}
      current-key-id: ${BOOKING_SOURCE_EVIDENCE_CURRENT_KEY_ID:}
      current-public-key-location: ${BOOKING_SOURCE_EVIDENCE_CURRENT_PUBLIC_KEY_LOCATION:}
      previous-key-id: ${BOOKING_SOURCE_EVIDENCE_PREVIOUS_KEY_ID:}
      previous-public-key-location: ${BOOKING_SOURCE_EVIDENCE_PREVIOUS_PUBLIC_KEY_LOCATION:}
  identity:
    url: ${IDENTITY_SERVICE_URL}
    connect-timeout: ${IDENTITY_CONNECT_TIMEOUT:2s}
    read-timeout: ${IDENTITY_READ_TIMEOUT:5s}
