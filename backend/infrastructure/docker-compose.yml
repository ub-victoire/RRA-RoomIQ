version: '3.9'

services:
  postgres:
    image: postgres:18-alpine
    container_name: rra-roomiq-postgres
    environment:
      POSTGRES_DB: RRA_RoomIQ
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d RRA_RoomIQ"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rra-roomiq-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  redis:
    image: redis:7-alpine
    container_name: rra-roomiq-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  records-lifecycle-service:
    profiles: ["applications"]
    build:
      context: ..
      dockerfile: records-lifecycle-service/Dockerfile
    environment:
      RLC_SERVICE_PORT: "8089"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      RLC_DB_URL: ${RLC_DB_URL:-}
      RLC_DB_USERNAME: ${RLC_DB_USERNAME:-}
      RLC_DB_PASSWORD: ${RLC_DB_PASSWORD:-}
      RLC_DB_MIGRATION_USERNAME: ${RLC_DB_MIGRATION_USERNAME:-}
      RLC_DB_MIGRATION_PASSWORD: ${RLC_DB_MIGRATION_PASSWORD:-}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL:-}
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "${RLC_HOST_PORT:-8089}:8089"

volumes:
  postgres_data:
  redis_data:
