version: '3.9'

services:
  postgres:
    image: postgres:18-alpine
    container_name: rra-roomiq-postgres
    environment:
      POSTGRES_DB: RRA_RoomIQ
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d RRA_RoomIQ"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rra-roomiq-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  redis:
    image: redis:7-alpine
    container_name: rra-roomiq-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  booking-service:
    profiles: ["applications"]
    build:
      context: ..
      dockerfile: booking-service/Dockerfile
    environment:
      BOOKING_SERVICE_PORT: "8085"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      BOOKING_DB_URL: ${BOOKING_DB_URL:-}
      BOOKING_DB_USERNAME: ${BOOKING_DB_USERNAME:-}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:-}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL:-}
      ORGANIZATION_SERVICE_URL: ${ORGANIZATION_SERVICE_URL:-}
      ROOM_SERVICE_URL: ${ROOM_SERVICE_URL:-}
      SCHEDULING_SERVICE_URL: ${SCHEDULING_SERVICE_URL:-}
      BOOKING_SOURCE_EVIDENCE_ENABLED: ${BOOKING_SOURCE_EVIDENCE_ENABLED:-false}
      BOOKING_SOURCE_EVIDENCE_RELAY_FIXED_DELAY_MS: ${BOOKING_SOURCE_EVIDENCE_RELAY_FIXED_DELAY_MS:-1000}
      RLC_SERVICE_URL: ${RLC_SERVICE_URL:-http://records-lifecycle-service:8089}
      BOOKING_SERVICE_TOKEN_ISSUER: ${BOOKING_SERVICE_TOKEN_ISSUER:-}
      BOOKING_SOURCE_EVIDENCE_SIGNING_KEY_ID: ${BOOKING_SOURCE_EVIDENCE_SIGNING_KEY_ID:-}
      BOOKING_SOURCE_EVIDENCE_SIGNING_PRIVATE_KEY_LOCATION: ${BOOKING_SOURCE_EVIDENCE_SIGNING_PRIVATE_KEY_LOCATION:-}
      RLC_SERVICE_TOKEN_ISSUER: ${RLC_SERVICE_TOKEN_ISSUER:-}
      RLC_SERVICE_TOKEN_CURRENT_KEY_ID: ${RLC_SERVICE_TOKEN_CURRENT_KEY_ID:-}
      RLC_SERVICE_TOKEN_CURRENT_PUBLIC_KEY_LOCATION: ${RLC_SERVICE_TOKEN_CURRENT_PUBLIC_KEY_LOCATION:-}
      RLC_SERVICE_TOKEN_PREVIOUS_KEY_ID: ${RLC_SERVICE_TOKEN_PREVIOUS_KEY_ID:-}
      RLC_SERVICE_TOKEN_PREVIOUS_PUBLIC_KEY_LOCATION: ${RLC_SERVICE_TOKEN_PREVIOUS_PUBLIC_KEY_LOCATION:-}
    ports:
      - "${BOOKING_HOST_PORT:-8085}:8085"
    depends_on:
      postgres:
        condition: service_healthy

  records-lifecycle-service:
    profiles: ["applications"]
    build:
      context: ..
      dockerfile: records-lifecycle-service/Dockerfile
    environment:
      RLC_SERVICE_PORT: "8089"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      RLC_DB_URL: ${RLC_DB_URL:-}
      RLC_DB_USERNAME: ${RLC_DB_USERNAME:-}
      RLC_DB_PASSWORD: ${RLC_DB_PASSWORD:-}
      RLC_DB_MIGRATION_USERNAME: ${RLC_DB_MIGRATION_USERNAME:-}
      RLC_DB_MIGRATION_PASSWORD: ${RLC_DB_MIGRATION_PASSWORD:-}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL:-}
      JWT_SECRET: ${JWT_SECRET:-}
      BOOKING_SERVICE_URL: ${RLC_BOOKING_HOLD_SERVICE_URL:-}
      BOOKING_SERVICE_TOKEN_ISSUER: ${BOOKING_SERVICE_TOKEN_ISSUER:-}
      BOOKING_SOURCE_EVIDENCE_CURRENT_KEY_ID: ${BOOKING_SOURCE_EVIDENCE_CURRENT_KEY_ID:-}
      BOOKING_SOURCE_EVIDENCE_CURRENT_PUBLIC_KEY_LOCATION: ${BOOKING_SOURCE_EVIDENCE_CURRENT_PUBLIC_KEY_LOCATION:-}
      BOOKING_SOURCE_EVIDENCE_PREVIOUS_KEY_ID: ${BOOKING_SOURCE_EVIDENCE_PREVIOUS_KEY_ID:-}
      BOOKING_SOURCE_EVIDENCE_PREVIOUS_PUBLIC_KEY_LOCATION: ${BOOKING_SOURCE_EVIDENCE_PREVIOUS_PUBLIC_KEY_LOCATION:-}
      RLC_BOOKING_SOURCE_EVIDENCE_ALLOWED_CATEGORIES: ${RLC_BOOKING_SOURCE_EVIDENCE_ALLOWED_CATEGORIES:-}
      RLC_SOURCE_EVIDENCE_MAX_AGE: ${RLC_SOURCE_EVIDENCE_MAX_AGE:-PT24H}
      RLC_SERVICE_TOKEN_ISSUER: ${RLC_SERVICE_TOKEN_ISSUER:-}
      RLC_SERVICE_TOKEN_KEY_ID: ${RLC_SERVICE_TOKEN_KEY_ID:-}
      RLC_SERVICE_TOKEN_PRIVATE_KEY_LOCATION: ${RLC_SERVICE_TOKEN_PRIVATE_KEY_LOCATION:-}
      RLC_BOOKING_HOLD_DELIVERY_ENABLED: ${RLC_BOOKING_HOLD_DELIVERY_ENABLED:-false}
    ports:
      - "${RLC_HOST_PORT:-8089}:8089"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
